<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="HIERO Bridge - Premium Academia–Industry Spatial Talent Gateway connecting verified collegiate talent to industry opportunities.">
  <title>HIERO Bridge | Spatial Talent Gateway</title>
  
  <link rel="icon" type="image/png" href="assets/hiero-bridge-logo.png">

  <!-- Google Fonts: Outfit, Plus Jakarta Sans, JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  

  <!-- Premium 3D Biomorphic Enterprise Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="hiero-entry-body">

  <!-- Premium Discord-Style Animated Logo Reveal Splash on Load/Reload -->
  <div id="hiero-splash-reveal" class="splash-reveal-overlay" aria-label="HIERO Bridge Logo Reveal">
    <div class="splash-reveal-stage">
      <!-- Ambient Backlight Glow -->
      <div class="splash-holo-ambient-glow" aria-hidden="true"></div>
      
      <!-- Concentric Orbital Rings -->
      <div class="splash-rings-container" aria-hidden="true">
        <div class="splash-ring splash-ring-1"></div>
        <div class="splash-ring splash-ring-2"></div>
        <div class="splash-ring splash-ring-3"></div>
      </div>

      <!-- Main Discord-Style Animated Logo Frame -->
      <div class="splash-logo-frame">
        <div class="splash-logo-shockwave" aria-hidden="true"></div>
        <div class="splash-logo-shockwave secondary" aria-hidden="true"></div>
        <div class="splash-logo-sheen-sweep" aria-hidden="true"></div>
        <img src="assets/hiero-bridge-logo.png" alt="HIERO Bridge Logo" class="splash-logo-img">
      </div>

      <!-- Synchronized Brand Typography Track-in -->
      <div class="splash-brand-text">
        <div class="splash-brand-title">HIERO <span class="accent-green">BRIDGE</span></div>
        <div class="splash-brand-sub">SPATIAL TALENT GATEWAY</div>
      </div>
    </div>
  </div>

  <!-- Cursor-Reactive Neural Constellation Particle Network Canvas -->
  <canvas id="network-canvas" class="network-bg-canvas"></canvas>

  <!-- ==========================================================================
       SPATIAL APPLICATION SHELL (FULL-WIDTH ENTERPRISE DASHBOARD)
       ========================================================================== -->
  <div id="app-container">
    <!-- Universal Sticky Top Header with Full-Width Navigation & Account Controls -->
    <header class="top-header">
      <!-- Left: Approved HIERO Bridge Logo -->
      <div class="top-header-brand">
        <div class="brand-logo-frame">
          <img src="assets/hiero-bridge-logo.png" alt="HIERO Bridge Logo" class="brand-logo-img">
        </div>
        <div class="brand-text-block">
          <div class="brand-title">HIERO <span>BRIDGE</span></div>
          <span class="brand-subtitle">SPATIAL TALENT GATEWAY</span>
        </div>
      </div>

      <!-- Center: Horizontal Workspace Navigation Tabs -->
      <nav class="top-workspace-nav" aria-label="Workspace Hubs">
        <button class="top-nav-tab active" data-role="coordinator" onclick="app.switchRole('coordinator')">
          <span class="nav-tab-icon">📊</span>
          <span class="nav-tab-label">Placement Ops Hub</span>
        </button>
        <button class="top-nav-tab" data-role="admin" onclick="app.switchRole('admin')">
          <span class="nav-tab-icon">🏛️</span>
          <span class="nav-tab-label">College Admin</span>
        </button>
      </nav>


      <!-- Right: Integrated Account / Profile Dropdown -->
      <div class="top-header-actions">
        <!-- User Profile Dropdown Wrapper -->
        <div class="profile-dropdown-wrapper" id="profile-dropdown-wrapper">
          <button type="button" class="user-profile-account-pill" id="user-profile-btn" onclick="window.app.toggleProfileDropdown(event)" aria-expanded="false" aria-label="Account Menu">
            <div class="user-avatar-circle" id="header-user-avatar">TP</div>
            <div class="user-profile-details">
              <div class="user-full-name" id="header-user-name">Dr. Ramesh Kulkarni (TPO)</div>
              <span class="user-role-label" id="header-role-pill">Placement Coordinator</span>
            </div>
            <svg class="profile-dropdown-arrow" id="profile-dropdown-arrow" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </button>

          <!-- Flyout Dropdown Menu -->
          <div class="profile-flyout-card" id="profile-flyout-menu" role="menu">
            <div class="profile-flyout-header">
              <div class="profile-flyout-avatar" id="flyout-user-avatar">TP</div>
              <div class="profile-flyout-info">
                <div class="flyout-user-name" id="flyout-user-name">Dr. Ramesh Kulkarni</div>
                <div class="flyout-user-email" id="flyout-user-email">tpo@nitw.ac.in</div>
                <div class="flyout-badge-row">
                  <span class="flyout-role-badge" id="flyout-role-badge">Placement Coordinator</span>
                  <span class="flyout-inst-tag" id="flyout-inst-tag">NIT Warangal</span>
                </div>
              </div>
            </div>

            <!-- Switch Persona / Workspace -->
            <div class="profile-flyout-section">
              <div class="flyout-section-title">SWITCH WORKSPACE HUB</div>
              <div class="flyout-role-options">
                <button type="button" class="flyout-role-item active" data-role="coordinator" onclick="window.app.switchRoleFromDropdown('coordinator')">
                  <span class="role-item-icon">📊</span>
                  <div class="role-item-text">
                    <strong>Placement Ops Hub</strong>
                    <small>TPO & Candidate Dispatch</small>
                  </div>
                  <span class="role-item-check">✓</span>
                </button>
                <button type="button" class="flyout-role-item" data-role="admin" onclick="window.app.switchRoleFromDropdown('admin')">
                  <span class="role-item-icon">🏛️</span>
                  <div class="role-item-text">
                    <strong>College Administrator</strong>
                    <small>Database & Verification</small>
                  </div>
                  <span class="role-item-check">✓</span>
                </button>
              </div>
            </div>

            <!-- Ecosystem Links & Tools -->
            <div class="profile-flyout-section">
              <div class="flyout-section-title">ECOSYSTEM & TOOLS</div>
              <button type="button" class="flyout-action-btn" onclick="window.app.openConnectSyncDrawer(); window.app.closeProfileDropdown();">
                <svg width="15" height="15" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                <span>HIERO Connect Sync Simulator</span>
              </button>
              <button type="button" class="flyout-action-btn" onclick="window.app.resetAllData(); window.app.closeProfileDropdown();">
                <svg width="15" height="15" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                <span>Reset Master Database</span>
              </button>
            </div>

            <div class="profile-flyout-divider"></div>

            <!-- Sign Out CTA -->
            <button type="button" class="flyout-signout-btn" onclick="window.hieroAuth ? window.hieroAuth.logout() : window.app.logout()">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                <polyline points="16 17 21 12 16 7"/>
                <line x1="21" y1="12" x2="9" y2="12"/>
              </svg>
              <span>Sign Out of HIERO Bridge</span>
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- Main Spatial Full-Width Viewport -->
    <div class="main-wrapper">
      <!-- Dynamic Role-Based View Containers -->
      <main id="main-content-body">
        <!-- Clean, Minimal Accredited Institution Banner -->
        <div class="institution-header-strip">
          <div class="inst-strip-left">
            <div class="inst-icon-shield">
              <svg width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 2l8 4v6c0 5.55-3.84 10.74-8 12-4.16-1.26-8-6.45-8-12V6l8-4z"/>
              </svg>
            </div>
            <div>
              <div class="inst-category-label">ACCREDITED INSTITUTION</div>
              <h2 class="inst-title-name" id="header-inst-name">National Institute of Technology, Warangal</h2>
            </div>
          </div>
          <div class="inst-strip-right">
            <button class="btn-inst-action" onclick="app.resetAllData()" title="Reset Master Data or Re-sync">
              <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
              <span>Reset Master Data</span>
            </button>
          </div>
        </div>

        <div id="coordinator-view-container"></div>
        <div id="admin-view-container" style="display: none;"></div>
        <div id="student-view-container" style="display: none;"></div>
      </main>
    </div>
  </div>



  <!-- Toast Notifications Mount Point -->
  <div id="hiero-toast-container" class="hiero-toast-container"></div>

  <!-- Modal and Drawer Mount Point for Hubs -->
  <div id="modal-root"></div>

  <!-- Application Logic Modules -->
  <script src="js/state.js"></script>
  <script src="js/api.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/coordinator.js"></script>
  <script src="js/student.js"></script>
  <script src="js/interview.js"></script>
  <script src="js/connect-sync.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
